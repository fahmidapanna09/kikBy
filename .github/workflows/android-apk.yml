name: Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7
      - name: Build web
        run: npm run build
      - name: Create Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/android-setup.mjs patch
      - name: Sync with site address
        env:
          KIKBITE_URL: ${{ vars.KIKBITE_URL }}
        run: node scripts/android-setup.mjs sync
      - name: Build debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kikbite-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
